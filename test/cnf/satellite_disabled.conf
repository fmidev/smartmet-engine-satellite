# A satellite engine which is switched off
#
# Setting 'disabled' makes the engine create an object of the API base
# class instead of the implementation. Nothing is read and no directory
# is scanned, so the rest of the configuration is not needed at all: the
# settings below are here only to show that they are ignored.

disabled = true;

rootdir = "/nonexistent";

products:
{
	nosuch:
	{
		producer = "nosuch";
		parameter = "nosuch";
		directory = "nosuch";
		pattern = ".*\\.tif$";
	};
};
