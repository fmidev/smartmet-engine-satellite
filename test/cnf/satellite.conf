# Satellite engine test configuration
#
# The sample data is currently a copy of the ten newest files of each
# /smartmet/satellite subdirectory. Once the data is packaged for the
# test machines this becomes a path under /usr/share/smartmet/test/data.
#
# SATELLITE_TEST_DATA can be set in the environment to point elsewhere.

rootdir = "$(SATELLITE_TEST_DATA)";

# One product is one composite of one satellite. The producer says which
# satellite the images come from and the parameter which composite of it,
# so that a client can list the satellites and then the composites of the
# one the user picked.

products:
{
        # RGBA in a projected coordinate system: the primary case

        meteosat_natural:
        {
                producer = "meteosat";
                parameter = "natural";
                directory = "seviri/0deg/level3/EPSG3035/img";
                pattern = ".*_EPSG3035_natural_with_colorized_ir_clouds\\.tif$";
                title = "Natural colours with colorized IR clouds";
                abstract = "SEVIRI natural colour composite of the 0 degree service";
                keywords = ["satellite", "seviri", "meteosat"];
                refresh_interval_secs = 60;
                max_files = 50;
        };

        # Another composite of the same satellite, in the native
        # geostationary projection

        meteosat_ir108:
        {
                producer = "meteosat";
                parameter = "ir108";
                directory = "seviri/0deg/level3/geos/img";
                pattern = ".*_geos_ir108\\.tif$";
                title = "Infrared 10.8 um";
                abstract = "SEVIRI infrared imagery in the satellite projection";
                keywords = ["satellite", "seviri", "meteosat"];
                max_files = 50;
        };

        # Uncoloured Float32 data of the same satellite. Recognized but
        # not supported yet.

        meteosat_ctth_tempe:
        {
                producer = "meteosat";
                parameter = "ctth_tempe";
                directory = "nwcsaf_geo/0deg/level3/EPSG3035/img";
                pattern = ".*_ctth_tempe\\.tif$";
                title = "Cloud top temperature";
                abstract = "NWC SAF cloud top temperature, uncoloured data";
                keywords = ["satellite", "nwcsaf"];
                max_files = 50;
        };

        # Ten timesteps of the same composite: exercises the time dimension

        meteosat_fog_rgb:
        {
                producer = "meteosat";
                parameter = "fog_rgb";
                directory = "test/dynamic_fog_rgb_ir";
                pattern = ".*_fog_rgb_ir\\.tif$";
                title = "Fog RGB";
                abstract = "Fog RGB composite based on infrared channels";
                keywords = ["satellite", "seviri", "meteosat", "fog"];
                max_files = 50;
        };

        # Gray + alpha, and the platform alternates between Metop-B and
        # Metop-C from one pass to the next

        metop_ir108:
        {
                producer = "metop";
                parameter = "ir108";
                directory = "avhrr/ears/level3/EPSG3035/img";
                pattern = ".*_EPSG3035_ir108_ilmavoimat\\.tif$";
                title = "AVHRR infrared 10.8 um";
                abstract = "AVHRR EARS infrared imagery";
                keywords = ["satellite", "avhrr", "metop"];
                max_files = 50;
        };

        # A large cloud optimized GeoTIFF in Eckert IV, which has no EPSG code

        goes_east_truecolor:
        {
                producer = "goes-east";
                parameter = "truecolor";
                directory = "abi/goes-east/level3/ESRI54012/img";
                pattern = ".*_truecolor_with_ash\\.tif$";
                title = "True colours with ash";
                abstract = "ABI true colour composite in the Eckert IV projection";
                keywords = ["satellite", "abi", "goes"];
                max_files = 50;
        };

        # A directory the test fills at run time, to verify that new files
        # are noticed without restarting the server

        livescan:
        {
                producer = "testsat";
                parameter = "livescan";
                directory = "$(SATELLITE_SCAN_DIR)";
                pattern = ".*_fog_rgb_ir\\.tif$";
                title = "Live scan test";
                abstract = "Directory filled by the test";
                refresh_interval_secs = 1;
                max_files = 50;
        };
};
