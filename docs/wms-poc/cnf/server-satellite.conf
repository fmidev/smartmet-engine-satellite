# Standalone server for satellite POC verification and benchmarking.
# Reuses the WMS test engine and plugin configuration. Run from test/:
#   SATELLITE_TEST_DATA=$HOME/hub/satellite/weather smartmetd -c cnf/server-satellite.conf

port = 8099;
slowpool = { maxthreads = 4; maxrequeuesize = 100; };
fastpool = { maxthreads = 8; maxrequeuesize = 100; };
verbose = true;
logrequests = false;
accesslogdir = "/tmp/smartmet-satellite-poc-logs";   # must exist and be writable

# We do not use dummy accounts for authentication
authentication	= false;

# If obsengine is not compiled in, alter lazylinking and engines.observation.disabled values
lazylinking	= false;

# To help debugging
stacktrace = true;

plugins:
{
	wms:
	{
	        configfile      = "wms-satellite.conf";
	        libfile         = "../../wms.so";
	};
};

engines:
{
	authentication:
	{
	        configfile      = "authentication.conf";
	};

	querydata:
	{
	        configfile      = "querydata.conf";
	};
	
	geonames:
	{
	        configfile      = "geonames.conf";
	};
	
	observation:
	{
	        configfile      = "observation.conf";
	};
	
	contour:
	{
	        configfile      = "contour.conf";
	};
	
	gis:
	{
	        configfile      = "gis.conf";
	};
	// required for linking to work, not actually used in querydata tests
	grid:
	{
		configfile	= "/usr/share/smartmet/test/grid/engine/grid-engine.conf"
	};

	avi:
	{
		configfile	= "avi.conf";
	}

	satellite:
	{
		configfile	= "satellite.conf";
	}
};
